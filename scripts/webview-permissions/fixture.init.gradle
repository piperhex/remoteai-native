gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.previewpermissionchecks'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/previewPermissionChecks.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'preview-permissions-fixture.apk' }
        }
    }
}
