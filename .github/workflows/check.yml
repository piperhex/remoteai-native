name: Native checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-dependencies.mjs
      - run: npm run check:i18n
      - run: npm run check
      - run: npm test
      - run: npm run export:android
      - run: npm run export:ios
