gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.projectDir, 'build-git-repositories'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.gitrepositoriesspec'
        project.extensions.getByName('react').entryFile =
                new File(project.rootDir, '../e2e/GitRepositoriesFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
    }
}
